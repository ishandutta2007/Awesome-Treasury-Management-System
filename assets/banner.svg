<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Pulse Keyframes via SVG Style -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; }
      }
      .flowing-path {
        stroke-dasharray: 8 6;
        animation: flowDash 15s linear infinite;
      }
      .pulsing-node {
        animation: shimmer 3s ease-in-out infinite;
      }
      .floating-group {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .bg-orb {
        transform-origin: center;
        animation: pulseGlow 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16" />

  <!-- Subtle Futuristic Grid Pattern -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="80" y1="0" x2="80" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="440" y1="0" x2="440" y2="380" />
    <line x1="560" y1="0" x2="560" y2="380" />
    <line x1="680" y1="0" x2="680" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="920" y1="0" x2="920" y2="380" />
    <line x1="1040" y1="0" x2="1040" y2="380" />
    <line x1="1160" y1="0" x2="1160" y2="380" />
  </g>

  <!-- Glowing Dynamic Background Orbs -->
  <circle cx="150" cy="80" r="140" fill="#3B82F6" opacity="0.22" filter="url(#glow)" class="bg-orb" />
  <circle cx="1060" cy="180" r="160" fill="#8B5CF6" opacity="0.25" filter="url(#glow)" class="bg-orb" />
  <circle cx="600" cy="360" r="180" fill="#06B6D4" opacity="0.18" filter="url(#glow)" class="bg-orb" />

  <!-- Dynamic Liquidity Flow Curves -->
  <g fill="none" opacity="0.75">
    <path class="flowing-path" d="M -50 300 C 250 200, 450 340, 750 240 C 950 180, 1100 260, 1250 210" stroke="#38BDF8" stroke-width="2.5" />
    <path class="flowing-path" d="M -50 330 C 200 280, 500 180, 800 290 C 1000 360, 1150 240, 1250 280" stroke="#818CF8" stroke-width="2" />
    <path class="flowing-path" d="M -50 240 C 300 350, 600 220, 850 190 C 1050 170, 1180 220, 1250 160" stroke="#F43F5E" stroke-width="1.8" />
  </g>

  <!-- Connected Treasury Nodes (Floating Network) -->
  <g class="floating-group">
    <!-- Central Treasury Vault Node -->
    <g transform="translate(940, 90)">
      <circle cx="0" cy="0" r="42" fill="#1E293B" stroke="url(#accentPurple)" stroke-width="2.5" filter="url(#glowLight)" />
      <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle">🏛️</text>
      <!-- Sub Orbit Nodes -->
      <circle cx="-65" cy="-35" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <text x="-65" y="-29" font-family="sans-serif" font-size="14" text-anchor="middle">💳</text>

      <circle cx="65" cy="-25" r="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
      <text x="65" y="-19" font-family="sans-serif" font-size="14" text-anchor="middle">📈</text>

      <circle cx="-50" cy="55" r="18" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
      <text x="-50" y="61" font-family="sans-serif" font-size="14" text-anchor="middle">💱</text>

      <circle cx="55" cy="55" r="18" fill="#0F172A" stroke="#EC4899" stroke-width="1.5" />
      <text x="55" y="61" font-family="sans-serif" font-size="14" text-anchor="middle">🤖</text>

      <!-- Connection Lines to Central Node -->
      <line x1="-48" y1="-26" x2="-26" y2="-14" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="48" y1="-18" x2="26" y2="-10" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="-37" y1="41" x2="-20" y2="22" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="41" y1="41" x2="22" y2="22" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>
  </g>

  <!-- Pulsing Network Junction Dots -->
  <g class="pulsing-node">
    <circle cx="280" cy="240" r="5" fill="#38BDF8" filter="url(#glowLight)" />
    <circle cx="480" cy="290" r="6" fill="#F43F5E" filter="url(#glowLight)" />
    <circle cx="680" cy="220" r="5" fill="#10B981" filter="url(#glowLight)" />
    <circle cx="820" cy="255" r="6" fill="#FBBF24" filter="url(#glowLight)" />
    <circle cx="1080" cy="230" r="5" fill="#C084FC" filter="url(#glowLight)" />
  </g>

  <!-- Header & Typography Content -->
  <g transform="translate(60, 48)">
    <rect width="320" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.8">ENTERPRISE TMS &amp; OPEN-SOURCE TLM</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Awesome Treasury
  </text>
  <text x="505" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#accentCyan)" letter-spacing="-0.5">
    Management System
  </text>

  <!-- Subtitle -->
  <text x="60" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    Curated Directory of Enterprise SaaS Solutions &amp; Open-Source Financial Platforms
  </text>

  <!-- Feature Highlights / Pills -->
  <g transform="translate(60, 215)">
    <!-- Pill 1: Cash & Liquidity -->
    <g transform="translate(0, 0)">
      <rect width="168" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" font-family="sans-serif" font-size="14">💰</text>
      <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F1F5F9">Cash &amp; Liquidity</text>
    </g>

    <!-- Pill 2: Bank Connectivity -->
    <g transform="translate(180, 0)">
      <rect width="180" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" font-family="sans-serif" font-size="14">🏦</text>
      <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F1F5F9">Bank Connectivity</text>
    </g>

    <!-- Pill 3: Cash Forecasting -->
    <g transform="translate(372, 0)">
      <rect width="164" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" font-family="sans-serif" font-size="14">📊</text>
      <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F1F5F9">Cash Forecasting</text>
    </g>

    <!-- Pill 4: FX & Risk Management -->
    <g transform="translate(548, 0)">
      <rect width="176" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" font-family="sans-serif" font-size="14">🛡️</text>
      <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F1F5F9">FX &amp; Risk Hedging</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 290)">
    <line x1="0" y1="0" x2="724" y2="0" stroke="#334155" stroke-width="1" />
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">🎯 COMPLETE COVERAGE:</text>
    <text x="160" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">Cash Positioning • Bank APIs / ISO 20022 • Payment Hubs • Multi-Currency • AI Analytics</text>
  </g>
</svg>
